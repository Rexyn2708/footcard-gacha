<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FootCard Gacha — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1a;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-container {
      width: 100%;
      max-width: 400px;
      background: #1a1a2e;
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid #333;
    }
    .auth-container h2 {
      text-align: center;
      color: #fff;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }
    .auth-input {
      width: 100%;
      padding: 12px;
      margin-bottom: 1rem;
      border-radius: 8px;
      border: 1px solid #444;
      background: #0f0f1a;
      color: #fff;
      font-size: 14px;
    }
    .auth-btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 0.5rem;
    }
    .auth-btn:hover { opacity: 0.9; }
    .auth-switch {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      margin-top: 1rem;
    }
    .auth-switch a {
      color: #667eea;
      cursor: pointer;
      text-decoration: underline;
    }
    .auth-error {
      color: #ff6b6b;
      text-align: center;
      font-size: 13px;
      margin-bottom: 1rem;
      display: none;
    }
    .auth-success {
      color: #51cf66;
      text-align: center;
      font-size: 13px;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Form Login -->
  <div class="auth-container" id="loginForm">
    <h2>⚽ FootCard Gacha</h2>
    <div class="auth-error" id="loginError"></div>
    <input class="auth-input" type="email"    id="loginEmail"    placeholder="Email">
    <input class="auth-input" type="password" id="loginPassword" placeholder="Password">
    <button class="auth-btn" onclick="handleLogin()">Login</button>
    <div class="auth-switch">
      Belum punya akun? <a onclick="showRegister()">Daftar di sini</a>
    </div>
  </div>

  <!-- Form Register -->
  <div class="auth-container" id="registerForm" style="display:none">
    <h2>⚽ Daftar Akun</h2>
    <div class="auth-error"   id="registerError"></div>
    <div class="auth-success" id="registerSuccess"></div>
    <input class="auth-input" type="text"     id="regUsername" placeholder="Username">
    <input class="auth-input" type="email"    id="regEmail"    placeholder="Email">
    <input class="auth-input" type="password" id="regPassword" placeholder="Password">
    <button class="auth-btn" onclick="handleRegister()">Daftar</button>
    <div class="auth-switch">
      Sudah punya akun? <a onclick="showLogin()">Login di sini</a>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    if (getToken()) window.location.href = "/"

    function showRegister() {
      document.getElementById("loginForm").style.display    = "none"
      document.getElementById("registerForm").style.display = "block"
    }

    function showLogin() {
      document.getElementById("registerForm").style.display = "none"
      document.getElementById("loginForm").style.display    = "block"
    }

    async function handleLogin() {
      const email    = document.getElementById("loginEmail").value
      const password = document.getElementById("loginPassword").value
      const errEl    = document.getElementById("loginError")

      if (!email || !password) {
        errEl.textContent   = "Email dan password wajib diisi"
        errEl.style.display = "block"
        return
      }

      const data = await login(email, password)

      if (data.error) {
        errEl.textContent   = data.error
        errEl.style.display = "block"
      } else {
        window.location.href = "/"
      }
    }

    async function handleRegister() {
      const username = document.getElementById("regUsername").value
      const email    = document.getElementById("regEmail").value
      const password = document.getElementById("regPassword").value
      const errEl    = document.getElementById("registerError")
      const sucEl    = document.getElementById("registerSuccess")

      if (!username || !email || !password) {
        errEl.textContent   = "Semua field wajib diisi"
        errEl.style.display = "block"
        return
      }

      const data = await register(username, email, password)

      if (data.error) {
        errEl.textContent   = data.error
        errEl.style.display = "block"
        sucEl.style.display = "none"
      } else {
        sucEl.textContent   = "Register berhasil! Silakan login."
        sucEl.style.display = "block"
        errEl.style.display = "none"
        setTimeout(() => showLogin(), 1500)
      }
    }
  </script>

</body>
</html>
